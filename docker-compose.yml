services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-platform-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-incident_management}
      POSTGRES_USER: ${DB_USERNAME:-incident_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - incident_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-incident_app} -d ${DB_NAME:-incident_management}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: incident-platform-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - incident_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  incident_postgres_data:
  incident_redis_data:
